    time_range: "8:00 AM - 5:00 PM CST"
    location: "Dallas, TX & Online"
    description: "The FAMLIES Retreat is an invitation-only workshop that brings
      together contributors to FAMLIES as well as those with a keen interest in the
      project. This is your opportunity to connect with fellow researchers and
